    <path d="M120 470 C140 320 200 300 240 290 C280 300 340 320 360 470 Z" fill="#cbd5e1"/>
  </g>

  <ellipse cx="240" cy="470" rx="150" ry="22" fill="#d4af37" opacity="0.15"/>
