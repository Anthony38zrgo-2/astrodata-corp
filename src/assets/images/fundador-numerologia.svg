<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 480" width="480" height="480">
  <defs>
    <clipPath id="c"><circle cx="240" cy="240" r="190"/></clipPath>
  </defs>
  <rect width="480" height="480" fill="#ffffff"/>

  <!-- Aro circular exterior centrado en x=240, y=240 (grosor aumentado) -->
