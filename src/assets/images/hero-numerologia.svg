<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 600" width="480" height="600">
  <defs>
    <clipPath id="clip"><circle cx="240" cy="270" r="205"/></clipPath>
    <!-- Filtro de sombreado sutil para dar contraste al texto con el fondo -->
    <filter id="astrodata-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2.5" stdDeviation="3" flood-color="#0b1b3d" flood-opacity="0.32"/>
    </filter>
  </defs>

  <rect width="480" height="600" fill="#ffffff"/>

  <g clip-path="url(#clip)">
    <circle cx="240" cy="270" r="205" fill="none" stroke="#d4af37" stroke-opacity="0.8" stroke-width="3.5"/>
    <circle cx="240" cy="270" r="168" fill="none" stroke="#d4af37" stroke-opacity="0.6" stroke-width="2.5"/>
    <circle cx="240" cy="270" r="132" fill="none" stroke="#d4af37" stroke-opacity="0.6" stroke-width="2.5"/>
    <circle cx="240" cy="270" r="96" fill="none" stroke="#d4af37" stroke-opacity="0.75" stroke-width="3"/>
    <circle cx="240" cy="270" r="60" fill="none" stroke="#d4af37" stroke-width="3.5"/>
    <circle cx="240" cy="270" r="5" fill="#d4af37"/>
    <path d="M240 226 L262 262 L336 270 L262 278 L240 314 L218 278 L144 270 L218 262 Z" fill="#d4af37" opacity="0.9"/>
  </g>

  <g>
    <!-- Nombre ASTRODATA con ligero sombreado para alto contraste con el fondo -->
    <text x="240" y="170" text-anchor="middle" font-family="'DM Serif Display', Georgia, serif" font-size="52" font-weight="700" letter-spacing="10" fill="#d4af37" filter="url(#astrodata-shadow)">ASTRODATA</text>
    <text x="240" y="202" text-anchor="middle" font-family="'DM Sans', Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="6" fill="#475569">NUMEROLOGIA</text>
  </g>

  <!-- Números 1, 2, 3 alineados horizontalmente con simetría perfecta respecto a x=240 -->
  <g font-family="'DM Serif Display', Georgia, serif" font-size="36" fill="#0b1b3d" text-anchor="middle" dominant-baseline="central">
    <text x="176" y="520">1</text>
    <circle cx="208" cy="520" r="2.5" fill="#d4af37"/>
    <text x="240" y="520">2</text>
    <circle cx="272" cy="520" r="2.5" fill="#d4af37"/>
    <text x="304" y="520">3</text>
  </g>
</svg>
